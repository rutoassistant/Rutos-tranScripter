name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('punkt_tab'); nltk.download('averaged_perceptron_tagger')"

      - name: Run Unit Tests
        run: python test_arithmetic_env.py

      - name: Run Lint (ruff)
        run: ruff check .

      - name: Run Type Check (mypy)
        run: mypy JAVS_Util Env javs.py test_arithmetic_env.py

      - name: Run E2E Tests
        run: python test_e2e.py test_full.ai
